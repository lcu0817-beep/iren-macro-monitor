<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>IREN Macro Monitor</title><style>
:root{--bg:#0b1020;--card:#121a2e;--text:#f5f7fb;--muted:#9aa7bd;--green:#37d67a;--yellow:#f6c95c;--red:#ff6b6b;--blue:#64a8ff;--border:#22304f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:14px 12px 32px}h1{font-size:22px;margin:2px 0 3px}.sub{color:var(--muted);font-size:12px;margin-bottom:12px}.hero{background:linear-gradient(180deg,#15203a,#10182a);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:10px}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.regime{font-size:20px;font-weight:800}.score{font-size:12px;color:var(--muted)}.trigger{margin-top:10px;padding:10px 11px;border-radius:12px;background:#0c1426;border:1px solid var(--border);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:11px}.label{font-size:11px;color:var(--muted);margin-bottom:4px}.value{font-size:20px;font-weight:800}.delta{font-size:11px;color:var(--muted);margin-top:3px}.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.g{background:rgba(55,214,122,.14);color:var(--green)}.y{background:rgba(246,201,92,.14);color:var(--yellow)}.r{background:rgba(255,107,107,.14);color:var(--red)}.m{background:rgba(154,167,189,.13);color:var(--muted)}.distance{font-size:12px;color:var(--muted)}.footer{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.5}.btn{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#071021;font-weight:800;border-radius:13px;padding:12px;margin-top:16px}.tiny{font-size:10px;color:var(--muted)}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap"><h1>📡 IREN Macro Monitor</h1><div class="sub">빠른 모바일 현황판 · GitHub Actions 자동 갱신</div><div class="hero"><div class="hero-top"><div><div class="regime" id="regime">Loading…</div><div class="score" id="score">—</div></div><div class="pill m" id="confirm">—/7</div></div><div class="trigger" id="trigger">최신 데이터 불러오는 중…</div></div><div class="grid"><div class="card"><div class="label">US 10Y</div><div class="value" id="us10y">—</div><div class="delta" id="us10ydist">—</div></div><div class="card"><div class="label">IREN</div><div class="value" id="iren">—</div><div class="delta" id="irendist">—</div></div><div class="card"><div class="label">MOVE</div><div class="value" id="move">—</div><div class="delta" id="movestate">—</div></div><div class="card"><div class="label">US 10Y REAL</div><div class="value" id="real10y">—</div><div class="delta">실질 할인율</div></div></div><div class="section"><h2>Rates</h2><div class="card"><div class="row"><span>US 2Y</span><strong id="us2y">—</strong></div><div class="row"><span>US 10Y</span><strong id="us10yrow">—</strong></div><div class="row"><span>US 30Y</span><strong id="us30y">—</strong></div><div class="row"><span>2s10s</span><strong id="curve">—</strong></div></div></div><div class="section"><h2>Risk Assets / Cross Asset</h2><div class="card" id="assets"></div></div><div class="section"><h2>Confirmation</h2><div class="card" id="checks"></div></div><a class="btn" id="lablink" href="#" target="_blank" rel="noopener">Open Macro Lab →</a><div class="footer">마지막 업데이트: <span id="updated">—</span><br>CTA 관련 항목은 실제 dealer CTA 포지션이 아니라 모멘텀 기반 프록시입니다.<div class="tiny" id="sourceNote"></div></div></div><script>
const TH={risk:5,confirm:4.6,irenDamage:40,irenBreakout:46};const f=(x,d=2)=>(x==null||Number.isNaN(Number(x)))?'—':Number(x).toFixed(d);const pct=(x,d=1)=>`${f(x,d)}%`;const pill=ok=>ok?'<span class="pill g">ON</span>':'<span class="pill m">OFF</span>';function assetState(m1,m3){if(m1>0&&m3>0)return'<span class="pill g">Long-ish</span>';if(m1<0&&m3<0)return'<span class="pill r">Short-ish</span>';return'<span class="pill y">Mixed</span>'}
async function load(){try{const d=await(await fetch('./data.json',{cache:'no-store'})).json(),v=d.values||{},m=d.momentum||{};const us10=Number(v.us10y),iren=Number(v.iren),move=Number(v.move),ndx50=Number(m.ndx?.vs50d);let checks=[['10Y < 4.60%',us10<4.6],['IREN > $46',iren>46],['Nasdaq > 50D',ndx50>0],['WTI 1M < 0',Number(m.wti?.m1)<0],['Gold 1M < 0',Number(m.gold?.m1)<0],['Copper 1M < 0',Number(m.copper?.m1)<0],['MOVE < 100',move<100]],c=checks.filter(x=>x[1]).length,score=0;if(us10<4.5)score+=3;else if(us10<4.6)score+=2;else if(us10<4.8)score++;else if(us10>=5)score-=2;if(iren>=50)score+=3;else if(iren>=46)score+=2;else if(iren>=40)score++;else if(iren<35)score-=2;if(move<100)score++;else if(move>=130)score--;if(ndx50>0)score++;['wti','gold','copper'].forEach(k=>{if(Number(m[k]?.m1)<0)score++});let regime='⚪ Neutral / contested',cls='m';if(score>=6){regime='🟢 Risk-on ignition';cls='g'}else if(score>=2){regime='🟡 Transition / constructive';cls='y'}else if(score<-1){regime='🔴 Discount-rate stress';cls='r'};regimeEl=document.getElementById('regime');regimeEl.textContent=regime;document.getElementById('score').textContent=`Regime score ${score>=0?'+':''}${score}`;const cf=document.getElementById('confirm');cf.textContent=`${c}/7`;cf.className=`pill ${cls}`;let trig='';if(us10<4.6&&iren>46)trig='🟢 Risk-on confirmed: 10Y < 4.60% + IREN > $46';else if(us10>5&&iren<40)trig='🔴 Defensive: 10Y > 5.00% + IREN < $40';else{let p=[];if(us10>=4.6)p.push(`10Y ${f((us10-4.6)*100,0)}bp ↓ 필요`);if(iren<=46)p.push(`IREN +${f((46/iren-1)*100,1)}% 필요`);trig='다음 Bull trigger · '+p.join(' · ')}document.getElementById('trigger').textContent=trig;document.getElementById('us10y').textContent=pct(us10);document.getElementById('us10yrow').textContent=pct(us10);document.getElementById('us10ydist').textContent=`4.60%까지 ${f((us10-4.6)*100,0)}bp`;document.getElementById('iren').textContent=`$${f(iren)}`;document.getElementById('irendist').textContent=`$46까지 +${f((46/iren-1)*100,1)}%`;document.getElementById('move').textContent=f(move,1);document.getElementById('movestate').textContent=move<100?'우호적':'변동성 경계';document.getElementById('real10y').textContent=pct(v.real10y);document.getElementById('us2y').textContent=pct(v.us2y);document.getElementById('us30y').textContent=pct(v.us30y);document.getElementById('curve').textContent=`${f((Number(v.us10y)-Number(v.us2y))*100,0)}bp`;const names=[['ndx','Nasdaq 100'],['sox','SOX'],['wti','WTI'],['gold','Gold'],['copper','Copper'],['dxy','DXY'],['btc','BTC']];document.getElementById('assets').innerHTML=names.map(([k,n])=>{const x=m[k]||{};return`<div class="row"><span>${n}</span><span>${assetState(Number(x.m1),Number(x.m3))} <span class="distance">${f(x.m1,1)}% / 1M</span></span></div>`}).join('');document.getElementById('checks').innerHTML=checks.map(([n,ok])=>`<div class="row"><span>${n}</span>${pill(ok)}</div>`).join('');document.getElementById('updated').textContent=d.updated_at||'—';document.getElementById('sourceNote').textContent=d.source_note||'';if(d.macro_lab_url)document.getElementById('lablink').href=d.macro_lab_url;else document.getElementById('lablink').style.display='none'}catch(e){document.getElementById('regime').textContent='⚪ Data unavailable';document.getElementById('trigger').textContent='data.json을 불러오지 못했습니다.';console.error(e)}}load();
</script></body></html>
